<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hidden Christmas Wish</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #1b1b2a, #0c0c12);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f5f5f7;
    }

    .note {
        position: relative;
        background: rgba(26,26,34,0.92);
        padding: 34px 28px;
        max-width: 360px;
        border-radius: 18px;
        box-shadow: 0 30px 60px rgba(0,0,0,0.45);
        animation: fadeIn 1.6s ease;
        z-index: 2;
        backdrop-filter: blur(6px);
    }

    .note p {
        font-size: 16px;
        line-height: 1.75;
        margin: 0 0 14px;
    }

    .tree {
        text-align: center;
        font-size: 22px;
        margin-top: 14px;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Snowflakes */
    .snowflake {
        position: fixed;
        top: -10px;
        color: white;
        font-size: 1em;
        user-select: none;
        pointer-events: none;
        opacity: 0.8;
        animation-name: fall;
        animation-timing-function: linear;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh);
        }
    }
</style>
</head>
<body>

<div class="note">
    <p>This is a small Christmas wish.</p>

    <p>
        That you smile today.<br>
        That you feel calm tonight.<br>
        And that you know — somewhere, someone wished you well.
    </p>

    <div class="tree">🎄 Merry Christmas 🎄</div>
</div>

<script>
    const snowflakes = ["❄", "❅", "❆"];

    function createSnowflake() {
        const snowflake = document.createElement("div");
        snowflake.className = "snowflake";
        snowflake.innerText = snowflakes[Math.floor(Math.random() * snowflakes.length)];
        snowflake.style.left = Math.random() * window.innerWidth + "px";
        snowflake.style.fontSize = Math.random() * 8 + 10 + "px";
        snowflake.style.animationDuration = Math.random() * 5 + 6 + "s";
        document.body.appendChild(snowflake);

        setTimeout(() => {
            snowflake.remove();
        }, 12000);
    }

    setInterval(createSnowflake, 250);
</script>

</body>
</html>
