<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Christmas Wish</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* PAGE */
body{
  margin:0;
  height:100vh;
  background:linear-gradient(#4a0d1b,#b1123c,#ffb6c1);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-family:"Times New Roman", Georgia, serif;
}

/* TOP TEXT */
.bg-text{
  position:fixed;
  top:25px;
  left:50%;
  transform:translateX(-50%);
  font-size:18px;
  font-weight:300;
  color:rgba(255,255,255,0.35);
  letter-spacing:2px;
  pointer-events:none;
  z-index:1;
}

/* SNOW */
.snow{
  position:fixed;
  top:-10px;
  color:white;
  opacity:.7;
  animation:fall linear infinite;
  z-index:2;
}
@keyframes fall{to{transform:translateY(110vh);}}

/* HEARTS */
.heart{
  position:fixed;
  width:10px;
  height:10px;
  background:#ff9bb3;
  transform:rotate(45deg);
  opacity:.6;
  animation:floatUp linear infinite;
  z-index:2;
}
.heart::before,.heart::after{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  background:#ff9bb3;
  border-radius:50%;
}
.heart::before{top:-5px;left:0;}
.heart::after{left:-5px;top:0;}
@keyframes floatUp{
  to{transform:translateY(-120vh) rotate(45deg);opacity:0;}
}

/* ENVELOPE */
.envelope-wrapper{
  width:340px;
  height:220px;
  perspective:1200px;
  cursor:pointer;
  z-index:3;
}
.envelope{position:relative;width:100%;height:100%;}

.body{
  position:absolute;
  inset:0;
  background:#fffafa;
  border-radius:6px;
  box-shadow:0 20px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.8);
  overflow:hidden;
}

/* FOLDS */
.left-fold,.right-fold{
  position:absolute;
  top:0;width:50%;height:100%;
  background:#f6e6ea;
}
.left-fold{left:0;clip-path:polygon(0 0,100% 50%,0 100%);}
.right-fold{right:0;clip-path:polygon(100% 0,0 50%,100% 100%);}

/* FLAP */
.flap{
  position:absolute;
  inset:0;
  background:linear-gradient(#ff6b81,#b1123c);
  clip-path:polygon(0 0,100% 0,50% 55%);
  transform-origin:top;
  transition:transform 1.1s ease;
  box-shadow:0 8px 14px rgba(0,0,0,.35);
  z-index:5;
}
.open .flap{transform:rotateX(-180deg);}

/* WAX SEAL */
.wax-seal{
  position:absolute;
  top:58%;
  left:50%;
  transform:translate(-50%,-50%);
  width:46px;
  height:46px;
  background:radial-gradient(circle at 30% 30%, #ff9bb3, #b1123c 70%);
  border-radius:50%;
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.4),
    inset 0 -3px 6px rgba(0,0,0,.35),
    0 6px 12px rgba(0,0,0,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.75);
  font-size:18px;
  z-index:6;
  transition:all .8s ease;
}
.open .wax-seal{
  opacity:0;
  transform:translate(-50%,-50%) scale(.6);
}

/* LETTER */
.letter{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%) translateY(40px);
  width:85%;
  background:#ffffff;
  padding:16px;
  border-radius:4px;
  box-shadow:0 10px 25px rgba(0,0,0,.25);
  opacity:0;
  transition:all 1s ease;
  z-index:2;
}
.open .letter{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

.note{
  text-align:center;
  color:#7a1c2f;
  font-size:13px;
  line-height:1.55;
}
.note p{margin:4px 0;}
.sign{margin-top:10px;font-weight:600;}

.qr{
  width:145px;
  display:block;
  margin:12px auto 0;
}
.scan-text{
  text-align:center;
  color:#b1123c;
  font-size:12px;
  margin-top:6px;
}
</style>
</head>

<body>

<!-- TOP TEXT -->
<div class="bg-text">someone thought of you today</div>

<!-- ENVELOPE -->
<div class="envelope-wrapper" id="env">
  <div class="envelope">
    <div class="body">
      <div class="left-fold"></div>
      <div class="right-fold"></div>

      <div class="letter">
        <div class="note">
          <p>This is a small Christmas wish.</p>
          <p>That you smile today.</p>
          <p>That you feel calm tonight.</p>
          <p>And that you know —</p>
          <p>somewhere, someone wished you well.</p>
          <p class="sign">🎄 Merry Christmas 🎄</p>
        </div>

        <img class="qr"
        src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://shreyansh-1529.github.io/Christmas-wish1/">

        <div class="scan-text">Scan when you’re ready</div>
      </div>
    </div>

    <div class="wax-seal">✦</div>
    <div class="flap"></div>
  </div>
</div>

<script>
const env=document.getElementById("env");
env.addEventListener("click",()=>env.classList.toggle("open"));

setInterval(()=>{
  const s=document.createElement("div");
  s.className="snow";
  s.textContent=Math.random()>0.5?"❄":"❆";
  s.style.left=Math.random()*100+"vw";
  s.style.fontSize=10+Math.random()*10+"px";
  s.style.animationDuration=5+Math.random()*5+"s";
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),10000);
},220);

setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.style.left=Math.random()*100+"vw";
  h.style.bottom="-10px";
  h.style.animationDuration=6+Math.random()*4+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),10000);
},700);
</script>

</body>
</html>
